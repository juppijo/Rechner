<script>
const $=s=>document.querySelector(s),gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const F=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return[n/g,d/g]};
const ad=(p,q)=>F(p[0]*q[1]+q[0]*p[1],p[1]*q[1]),mu=(p,q)=>F(p[0]*q[0],p[1]*q[1]),ng=p=>F(-p[0],p[1]);
const fs=p=>(p[0]<0?'−':'')+Math.abs(p[0])+(p[1]>1?'/'+p[1]:''),P=v=>v[0]<0?'('+fs(v)+')':fs(v);

const LN=(m,n)=>('y = '+(m[0]?(m[0]==m[1]?'':m[0]==-m[1]?'−':fs(m)+'·')+'x':'')+(n[0]?(n[0]<0?' − '+fs(ng(n)):(m[0]?' + ':'')+fs(n)):(m[0]?'':'0'))).replace(/ +/g,' ');
const R=(m,n)=>LN(m,n).slice(4);
const sol=e=>{const[a1,b1,c1,a2,b2,c2]=e,d=a1*b2-a2*b1;return{x:F(c1*b2-c2*b1,d),y:F(a1*c2-a2*c1,d)}};
function steps(k,e){const[a1,b1,c1,a2,b2,c2]=e,{x,y}=sol(e),m1=F(-a1,b1),n1=F(c1,b1),m2=F(-a2,b2),n2=F(c2,b2),L=[];
const v=(a,b)=>fs(ad(mu(F(a),x),mu(F(b),y)));
const pb=`<b>Probe:</b> I: ${a1}·${P(x)} + ${b1}·${P(y)} = ${v(a1,b1)} ✓ &nbsp; II: ${a2}·${P(x)} + ${b2}·${P(y)} = ${v(a2,b2)} ✓`;
const um=`Beide Gleichungen nach <i>y</i> umformen:<br>I &nbsp;${LN(m1,n1)}<br>II ${LN(m2,n2)}`;
if(k=='g'){L.push(um,`Gerade I schneidet die y-Achse bei ${fs(n1)} (Steigung ${fs(m1)}), Gerade II bei ${fs(n2)} (Steigung ${fs(m2)}). Zeichne beide Geraden – siehe Grafik.`,`Schnittpunkt ablesen: <b>S(${fs(x)} | ${fs(y)})</b>, also x = ${fs(x)} und y = ${fs(y)}.`,pb)}
if(k=='q'){L.push(um,`Gleichsetzen (I = II):<br>${R(m1,n1)} = ${R(m2,n2)}`,`x-Terme nach links, Zahlen nach rechts:<br>(${fs(m1)} − ${P(m2)})·x = ${fs(n2)} − ${P(n1)}<br>${fs(ad(m1,ng(m2)))}·x = ${fs(ad(n2,ng(n1)))} → <b>x = ${fs(x)}</b>`,`x in I einsetzen: y = ${fs(m1)}·${P(x)} + ${P(n1)} → <b>y = ${fs(y)}</b>`,pb)}
if(k=='e'){const kk=ad(F(a2),mu(F(b2),m1)),r=ad(F(c2),ng(mu(F(b2),n1)));L.push(`Gleichung I nach y auflösen:<br>${LN(m1,n1)}`,`Diesen Term für y in II einsetzen:<br>${a2}·x + ${b2}·(${R(m1,n1)}) = ${c2}`,`Ausmultiplizieren und zusammenfassen:<br>${fs(kk)}·x = ${fs(r)} → <b>x = ${fs(x)}</b>`,`x in die umgeformte Gleichung einsetzen → <b>y = ${fs(y)}</b>`,pb)}
if(k=='a'){L.push(`Ziel: x soll wegfallen. I mit ${P(F(a2))} und II mit ${P(F(a1))} multiplizieren:<br>I·${P(F(a2))}: ${EQ(a1*a2,b1*a2,c1*a2)}<br>II·${P(F(a1))}: ${EQ(a1*a2,b2*a1,c2*a1)}`,`Subtrahieren (I − II):<br>${EQ(0,b1*a2-b2*a1,c1*a2-c2*a1)} → <b>y = ${fs(y)}</b>`,`y in I einsetzen:<br>${a1}·x + ${b1}·${P(y)} = ${c1} → <b>x = ${fs(x)}</b>`,pb)}

const SH=(k,e)=>'<ol class="steps">'+steps(k,e).map(s=>`<li>${s}</li>`).join('')+'</ol>';

draw(cv,[{m:-a1/b1,n:c1/b1,c:'--l1',l:'I'},{m:-a2/b2,n:c2/b2,c:'--l2',l:'II'}],[x,y],-ax,ax,-ay,ay)}

const MS={g:'Zwei lineare Gleichungen bilden ein lineares Gleichungssystem. Die Koordinaten des Schnittpunkts der beiden Geraden sind die Lösung.',q:'Beim Gleichsetzungsverfahren werden beide Gleichungen nach derselben Variablen umgeformt. Die rechten Seiten sind gleich – übrig bleibt eine Gleichung mit nur einer Variablen.',e:'Beim Einsetzungsverfahren wird eine Gleichung nach einer Variablen aufgelöst. Der Term wird in die andere Gleichung eingesetzt – wieder bleibt nur eine Variable.',a:'Beim Additions- bzw. Subtraktionsverfahren werden die Gleichungen so umgeformt, dass beim Addieren oder Subtrahieren eine Variable wegfällt.'};
const HT={g:['Forme beide Gleichungen nach y um (y = m·x + b).','Zeichne die Geraden: y-Achsenabschnitt b, dann Steigung m abtragen.','Lies die Koordinaten des Schnittpunkts ab.'],q:['Beide Gleichungen nach y auflösen und die rechten Seiten gleichsetzen.','Löse die entstandene Gleichung: x-Terme links, Zahlen rechts.','Setze x in eine Gleichung ein, um y zu erhalten. Dann Probe!'],e:['Suche eine Gleichung, die du leicht nach einer Variablen auflösen kannst.','Setze den Term in die andere Gleichung ein – dann steckt nur noch eine Variable drin.','Berechne die zweite Variable durch Einsetzen. Dann Probe!'],a:['Multipliziere die Gleichungen so, dass bei x (oder y) gleiche Zahlen stehen.','Subtrahiere (oder addiere) die Gleichungen – eine Variable fällt weg.','Berechne die zweite Variable durch Einsetzen. Dann Probe!']};
const G='Löse das Gleichungssystem mit dem Gleichsetzungsverfahren. Mache die Probe.',E='Löse das Gleichungssystem mit dem Einsetzungsverfahren. Mache die Probe.',A='Löse das Gleichungssystem mit dem Additions- bzw. Subtraktionsverfahren. Mache die Probe.';

{n:'Grafisch',i:'📈',m:'g',d:'Löse zeichnerisch (Lösung im Lösungsweg kontrollieren).',t:[

function rPrac(){const c=C[ci],n=c.t.length,t=c.t[Math.min(ti,n-1)],e=t[0],[a1,b1,c1,a2,b2,c2]=e,s=sol(e),key=ci+'-'+ti;used=0;hn=0;sm=c.m;
const q=t[2]||(c.y?[LN(F(-a1,b1),F(c1,b1)),LN(F(-a2,b2),F(c2,b2))]:[EQ(a1,b1,c1),EQ(a2,b2,c2)]);
$('#practice').innerHTML=`<div class="pills">${C.map((x,i)=>`<button class="pill ${i==ci?'on':''}" data-c="${i}">${x.i} ${x.n} (${cnt(i)}/${x.t.length})</button>`).join('')}</div>
<div class="card"><div class="top"><span>Aufgabe ${ti+1} von ${n}</span><span>${S.d[key]?'✅ gelöst':''}</span></div>
<div class="bar"><i style="width:${cnt(ci)/n*100}%"></i></div>
<p>${t[1]||c.d}</p><div class="eqs"><div><b>I</b> &nbsp; ${q[0]}</div><div><b>II</b> &nbsp; ${q[1]}</div></div>
<div class="ins"><label>${t[3]||'x'}<input id="ix" inputmode="decimal" autocomplete="off" placeholder="z. B. 3, 2,5 oder 7/2"></label><label>${t[4]||'y'}<input id="iy" inputmode="decimal" autocomplete="off"></label></div>
<div class="row"><button class="btn ok" id="chk">✔ Prüfen</button><button class="btn" id="hb">💡 Tipp</button><button class="btn" id="sb">📖 Lösungsweg</button></div>
<div class="fb" id="fb" role="status"></div><div id="hints"></div><div id="sol"></div>
<div class="row"><button class="btn" id="pv">← Zurück</button><button class="btn main" id="nx">Weiter →</button>${c.g?'<button class="btn" id="rs">🎲 Neue Serie</button>':''}</div></div>
<button class="pill" id="rst">↺ Fortschritt zurücksetzen</button>`;
document.querySelectorAll('#practice [data-c]').forEach(b=>b.onclick=()=>{ci=+b.dataset.c;ti=0;if(C[ci].g)resetZ();rPrac()});
$('#pv').onclick=()=>{ti=(ti+n-1)%n;rPrac()};$('#nx').onclick=()=>{ti=(ti+1)%n;rPrac()};
if(c.g)$('#rs').onclick=()=>{resetZ();ti=0;rPrac()};
$('#rst').onclick=()=>{if(confirm('Gesamten Fortschritt löschen?')){S={d:{}};save();pts();rPrac()}};
$('#hb').onclick=()=>{used=1;const h=HT[c.m];if(hn<3){$('#hints').insertAdjacentHTML('beforeend',`<div class="hint">💡 Tipp ${hn+1}: ${h[hn]}</div>`);hn++}else if(hn==3){$('#hints').insertAdjacentHTML('beforeend',`<div class="hint">🔎 Verrat: x = ${fs(s.x)}</div>`);hn++}};
$('#sb').onclick=()=>{used=1;rSol(e)};
const ch=()=>{const vx=pr($('#ix').value),vy=pr($('#iy').value),ok=(v,f)=>Math.abs(v-f[0]/f[1])<.01,a=ok(vx,s.x),b=ok(vy,s.y),fb=$('#fb');
if(a&&b){if(!S.d[key]){S.d[key]=used?5:10;save();pts()}fb.className='fb ok';fb.textContent='🎉 Richtig! '+(used?'+5':'+10')+' Punkte'}
else{fb.className='fb bad';fb.textContent=isNaN(vx)||isNaN(vy)?'Bitte beide Felder ausfüllen.':a?'x stimmt, y noch nicht – rechne nach!':b?'y stimmt, x noch nicht – rechne nach!':'Noch nicht ganz. Brauchst du einen Tipp?'}};
$('#chk').onclick=ch;document.querySelectorAll('#practice input').forEach(i=>i.onkeydown=ev=>{if(ev.key=='Enter')ch()})}
function resetZ(){newSet();Object.keys(S.d).filter(k=>k.startsWith('4-')).forEach(k=>delete S.d[k]);save();pts()}
function rSol(e){$('#sol').innerHTML=`<h3>Lösungsweg</h3><div class="pills">${Object.keys(MN).map(k=>`<button class="pill ${k==sm?'on':''}" data-s="${k}">${MN[k]}</button>`).join('')}</div>${SH(sm,e)}<canvas id="sc"></canvas>`;
document.querySelectorAll('#sol [data-s]').forEach(b=>b.onclick=()=>{sm=b.dataset.s;rSol(e)});drawTask($('#sc'),e)}
const sv={m1:1,n1:2,m2:-.5,n2:5};
function rLab(){const f=(k,l)=>`<div class="sl"><span>${l}</span><input type="range" min="-8" max="8" step=".5" value="${sv[k]}" data-k="${k}"><b id="v${k}">${sv[k]}</b></div>`;
$('#lab').innerHTML=`<div class="card"><h2>Grafik-Labor</h2><p>Verändere die Geraden <b style="color:var(--l1)">I</b> und <b style="color:var(--l2)">II</b> und beobachte den Schnittpunkt. Parallele Geraden haben keinen Schnittpunkt – das Gleichungssystem hat dann keine Lösung.</p>
${f('m1','I: Steigung m')}${f('n1','I: y-Achsenabschnitt b')}${f('m2','II: Steigung m')}${f('n2','II: y-Achsenabschnitt b')}<div class="eqs" id="le"></div><canvas id="lcv"></canvas></div>`;
document.querySelectorAll('#lab input').forEach(i=>i.oninput=()=>{sv[i.dataset.k]=+i.value;ul()});ul()}
function ul(){const{m1,n1,m2,n2}=sv;for(const k in sv)$('#v'+k).textContent=sv[k];let pt=null,t;
if(m1==m2)t=n1==n2?'Die Geraden liegen aufeinander: unendlich viele Lösungen.':'Die Geraden sind parallel: keine Lösung.';else{const x=(n2-n1)/(m1-m2),y=m1*x+n1;pt=[x,y];t=`Schnittpunkt S(${+x.toFixed(2)} | ${+y.toFixed(2)}) → Lösung: x = ${+x.toFixed(2)}, y = ${+y.toFixed(2)}`}
$('#le').innerHTML=`<b>I</b> y = ${m1}x + ${n1} &nbsp; <b>II</b> y = ${m2}x + ${n2}<br>${t}`;draw($('#lcv'),[{m:m1,n:n1,c:'--l1',l:'I'},{m:m2,n:n2,c:'--l2',l:'II'}],pt,-10,10,-10,10)}
const view=t=>{['learn','practice','lab'].forEach(i=>$('#'+i).hidden=i!=t);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({learn:rLearn,practice:rPrac,lab:rLab})[t]()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.t));
$('#fs').onclick=()=>{const on=document.body.classList.toggle('focus');try{if(on&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}$('#fs').textContent=on?'⮌ Normal':'⛶ Vollbild'};
$('#th').onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark';r.dataset.theme=d?'light':'dark';const a=document.querySelector('section:not([hidden])').id;view(a)};
pts();view('learn');
</script></body></html>
