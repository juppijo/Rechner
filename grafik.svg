<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Vibrant Circle Gradient -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
  </defs>

  <!-- Background -->
  <rect 
  width="800" 
  height="600" 
  rx="24" 
  fill="none" 
  stroke="#3b82f6" 
  stroke-width="3" 
  />

  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" opacity="0.3"/>

  <!-- Decorative Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Center Glowing Shape -->
  <circle cx="400" cy="270" r="110" fill="none" stroke="url(#circleGrad)" stroke-width="12" filter="url(#glow)" />
  
  <polygon points="400,200 450,310 350,310" fill="#f43f5e" opacity="0.85" filter="url(#glow)"/>

  <!-- Styled Typography -->
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    SVG LIVE EDITOR
  </text>
  <text x="300" y="100" font-family="sans-serif" font-size="24" fill="#ffffff">Hallo SVG</text>
  
  <rect x="550" y="50" width="150" height="100" fill="#38bdf8" rx="8" />
  
  <circle cx="100" cy="400" r="60" fill="#f43f5e" />

  <defs>
    <linearGradient id="myGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="200" height="100" fill="url(#myGradient)" rx="12" />
  
  
  <!-- Balkendiagramm Gruppe -->
  <g transform="translate(100, 100)">
    <rect x="0" y="100" width="40" height="100" fill="#38bdf8" rx="4" />
    <rect x="60" y="40" width="40" height="160" fill="#818cf8" rx="4" />
    <rect x="120" y="70" width="40" height="130" fill="#c084fc" rx="4" />
  </g>
  
  <text x="400" y="480" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">
    Bearbeite den Code auf der linken Seite in Echtzeit
  </text>
</svg>